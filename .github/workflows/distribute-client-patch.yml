name: Distribute release client patch DLL

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type PUBLISH to confirm launcher distribution"
        required: true
        type: string
      release_number:
        description: "Optional positive number; blank selects the next client-patches-vN"
        required: false
        type: string
      prerelease:
        description: "Mark the GitHub release as a prerelease"
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: distribute-client-patch-release
  cancel-in-progress: false

jobs:
  build:
    name: Build and verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Validate manual request
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [[ "$GITHUB_REF_NAME" != "$DEFAULT_BRANCH" ]]; then
            echo "Run this release workflow only from the default branch." >&2
            exit 1
          fi
          if [[ "$CONFIRMATION" != "PUBLISH" ]]; then
            echo "The confirmation input must be exactly PUBLISH." >&2
            exit 1
          fi

      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Install build toolchain
        run: |
          sudo apt-get update
          sudo apt-get install --yes make g++ g++-mingw-w64-i686

      - name: Test and package release DLL
        run: |
          make test
          bash build-client-patch.sh package-release

      - name: Stage verified release DLL
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: client-patch-release
          path: out/distribution/Commonwealth-GA-Client-Patches-x86.dll
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish verified release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Check out release publisher
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Install release verification tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes binutils-mingw-w64-i686

      - name: Download verified release DLL
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: client-patch-release
          path: out/distribution

      - name: Publish release in this repository
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_NUMBER: ${{ inputs.release_number }}
          MARK_PRERELEASE: ${{ inputs.prerelease }}
        run: |
          args=()
          if [[ -n "$RELEASE_NUMBER" ]]; then
            args+=(--release-number "$RELEASE_NUMBER")
          fi
          if [[ "$MARK_PRERELEASE" == "true" ]]; then
            args+=(--prerelease)
          else
            args+=(--stable)
          fi
          bash tools/publish-client-patch-release.sh "${args[@]}"
